# The whole pipeline: checks (clippy + tests), then builds the release downloads and publishes
# them as a GitHub Release.
#
#   git tag v0.4.0 && git push origin v0.4.0           -> release
#   git tag v0.4.0-beta.1 && git push origin v0.4.0-beta.1 -> pre-release (any tag with a "-")
#
# The tag (without its "-beta.N" part) must match the version in Cargo.toml.
# Clippy and the whole test suite run first; a failure stops the builds and the release.
# Pushes to master that touch the code (and runs started by hand) build the
# downloads as workflow artifacts without publishing anything.
#
# Downloads:
#   ByteForge-<ver>-windows-x64-setup.exe   installer (current user, no admin needed)
#   ByteForge-<ver>-windows-x64.zip         portable
#   byteforge-<pkgver>-1-x86_64.pkg.tar.zst Arch package (`sudo pacman -U <file>`)
#   ByteForge-<ver>-macos-arm64.dmg         macOS app, Apple Silicon (ad-hoc signed, not notarized)
#   ByteForge-<ver>-macos-x64.dmg           macOS app, Intel (ad-hoc signed, not notarized)
# The signed [devstarbyte] pacman repo is still built by DevStarByte/arch-repo.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [master]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "themes/**"
      - "modules/**"
      - "packaging/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Clippy (warnings fail the run) and the whole test suite on Arch Linux, Windows and macOS.
  # Everything below waits for it through `version`, so nothing is built or published unless every
  # check passes. Arch runs in an archlinux container with Arch's own rust, .NET SDK and git; Windows
  # and macOS use the runners' preinstalled .NET SDK and git. Tests that need a tool the runner lacks
  # (csharp-ls, netcoredbg, docker containers, …) skip themselves.
  tests:
    name: tests (${{ matrix.name }})
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      # English dotnet output, whatever the runner's locale (tests read it)
      DOTNET_CLI_UI_LANGUAGE: en
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arch
            os: ubuntu-latest
            container: archlinux:base-devel
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # Before checkout: actions/checkout needs git in the container for a real clone.
      - name: Arch packages
        if: matrix.name == 'arch'
        run: |
          pacman -Syu --noconfirm --needed \
            git rust cmake clang pkgconf \
            vulkan-icd-loader libxkbcommon libxkbcommon-x11 wayland libx11 libxcb \
            fontconfig freetype2 alsa-lib dotnet-sdk curl

      - uses: actions/checkout@v4

      # The container runs as root on a checkout owned by the runner user; tests run git there.
      - name: Trust the checkout
        if: matrix.name == 'arch'
        run: git config --global --add safe.directory '*'

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.name != 'arch'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked --no-fail-fast

  version:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      pkgver: ${{ steps.v.outputs.pkgver }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          cargo_ver=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ver=${GITHUB_REF_NAME#v}
            if [ "${ver%%-*}" != "$cargo_ver" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_ver"
              exit 1
            fi
          else
            ver="$cargo_ver-dev.${GITHUB_SHA::7}"
          fi
          # pacman versions can't hold "-": 0.4.0-beta.1 -> 0.4.0beta.1 (sorts before 0.4.0)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "pkgver=${ver//-/}" >> "$GITHUB_OUTPUT"
          [[ "$ver" == *-* ]] && pre=true || pre=false
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "Version $ver (pre-release: $pre)"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Tagged releases are signed through SignPath once the SIGNPATH_API_TOKEN secret
      # exists (see docs/code-signing.md); everything else stays unsigned.
      SIGN: ${{ github.ref_type == 'tag' && secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p byteforge
        env:
          # the updater compares against the release version, beta suffix included
          BYTEFORGE_VERSION: ${{ needs.version.outputs.version }}

      - name: Stage
        shell: pwsh
        run: |
          $dir = "dist\ByteForge"
          New-Item -ItemType Directory -Force "$dir\themes" | Out-Null
          Copy-Item target\release\byteforge.exe $dir
          Copy-Item themes\*.json "$dir\themes"
          Copy-Item -Recurse modules "$dir\modules"
          Copy-Item README.md, LICENSE $dir

      # Sign byteforge.exe first, so both the zip and the installer carry the signed one.
      - name: Upload unsigned exe
        if: env.SIGN == 'true'
        id: unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: dist/ByteForge/byteforge.exe

      - name: Sign exe
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/ByteForge

      - name: Zip and installer
        shell: pwsh
        run: |
          Compress-Archive -Path dist\ByteForge -DestinationPath "dist\ByteForge-$env:VERSION-windows-x64.zip"
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $default = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $default)) { choco install innosetup -y --no-progress | Out-Null }
            $iscc = $default
          } else { $iscc = $iscc.Source }
          New-Item -ItemType Directory -Force dist\setup | Out-Null
          & $iscc /Q "/DAppVersion=$env:VERSION" "/DNumVersion=$($env:VERSION.Split('-')[0])" "/DSourceDir=$PWD\dist\ByteForge" "/DOutputDir=$PWD\dist\setup" packaging\windows\byteforge.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unsigned installer
        if: env.SIGN == 'true'
        id: unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: dist/setup/*-setup.exe

      - name: Sign installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/setup

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/setup/*-setup.exe
          if-no-files-found: error

  arch:
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      PKGVER: ${{ needs.version.outputs.pkgver }}
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4

      # makepkg refuses to run as root
      - name: Add a build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"

      - name: Build package
        working-directory: packaging/arch
        run: |
          sed -i "s/^pkgver=.*/pkgver=$PKGVER/" PKGBUILD
          sudo -u builder makepkg --syncdeps --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  macos:
    needs: version
    # All builds run on Apple Silicon; Intel is cross-compiled.
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BYTEFORGE_VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Build app and dmg
        run: packaging/macos/bundle.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, windows, arch, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{windows,arch,macos-*}"
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: ByteForge ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          # Every download by name: the Windows installer arrives in dist/setup/ (its artifact keeps that
          # folder), which `dist/*` never matched. Each pattern must match, so a missing one fails the run.
          files: |
            dist/setup/*-setup.exe
            dist/*.zip
            dist/*.pkg.tar.zst
            dist/*.dmg
          fail_on_unmatched_files: true
