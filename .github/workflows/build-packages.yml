# Build the packages and the [byteforge] repo database whenever a package's
# source changes: push to pkgs/<name>/ and pacman sees the new version once
# the build is done. Does what you would do by hand on Arch:
#   cd pkgs/byteforge && makepkg -s && repo-add -R x86_64/byteforge.db.tar.gz *.pkg.tar.zst
# and commits x86_64/ back to this branch.
#
# Signing is optional: put an armored GPG private key (no passphrase) in the
# secret GPG_PRIVATE_KEY (Settings -> Secrets and variables -> Actions) and the
# packages and the database get signed. Without it the repo is unsigned.
name: Build packages

on:
  push:
    branches: [packages]
    paths:
      - "pkgs/**"
      - ".github/workflows/build-packages.yml"
  workflow_dispatch:

permissions:
  contents: write

# one build at a time, in order: each one starts from the newest branch
concurrency:
  group: build-packages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # git first, so checkout makes a real clone we can push from
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - name: Check out the packages
        uses: actions/checkout@v4
        with:
          ref: packages

      # makepkg refuses to run as root
      - name: Add a build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder: pkgs
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::warning::No GPG_PRIVATE_KEY secret: the repo will be unsigned"
            exit 0
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" | sudo -u builder gpg --batch --import
          fpr=$(sudo -u builder gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          echo "GPGKEY=$fpr" >> "$GITHUB_ENV"

      - name: Build
        run: |
          for dir in pkgs/*/; do
            (cd "$dir" && sudo -u builder env GPGKEY="${GPGKEY:-}" \
              makepkg --syncdeps --noconfirm --cleanbuild ${GPGKEY:+--sign})
          done

      - name: Update the repo database
        run: |
          mkdir -p x86_64
          for pkg in pkgs/*/*.pkg.tar.zst; do
            cp "$pkg" x86_64/
            [ -f "$pkg.sig" ] && cp "$pkg.sig" x86_64/
            chown -R builder: x86_64
            (cd x86_64 && sudo -u builder env GPGKEY="${GPGKEY:-}" \
              repo-add --remove ${GPGKEY:+--sign --key "$GPGKEY"} byteforge.db.tar.gz "$(basename "$pkg")") || exit 1
          done
          # git stores the .db/.files symlinks as text, which raw.githubusercontent
          # would serve as is: replace them with real copies
          cd x86_64
          for f in byteforge.db byteforge.files; do
            rm -f "$f" "$f.sig"
            cp "$f.tar.gz" "$f"
            [ -f "$f.tar.gz.sig" ] && cp "$f.tar.gz.sig" "$f.sig"
          done
          rm -f *.old *.old.sig
          ls -la

      - name: Commit the built packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A x86_64
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Build packages for ${GITHUB_SHA::7}"
          git push origin HEAD:packages
