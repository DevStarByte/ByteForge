# Checks every push and pull request: clippy (warnings fail the run) and the whole test suite,
# on Arch Linux, Windows and macOS. Linux runs in an archlinux container (the platform ByteForge is
# packaged for) with Arch's own rust, .NET SDK and git; Windows and macOS use the runners'
# preinstalled .NET SDK and git. Tests that need a tool the runner lacks (csharp-ls, netcoredbg,
# docker containers, …) skip themselves. Builds and releases are left to release.yml, which calls
# this workflow first and builds only when it passes.
name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
  # release.yml runs these checks first and builds nothing unless they pass
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when release.yml calls this, so the standalone CI run and the
# release's checks never cancel each other; only standalone runs cancel an older run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

env:
  CARGO_TERM_COLOR: always
  # English dotnet output, whatever the runner's locale (tests read it)
  DOTNET_CLI_UI_LANGUAGE: en
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  check:
    name: check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arch
            os: ubuntu-latest
            container: archlinux:base-devel
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # Before checkout: actions/checkout needs git in the container for a real clone.
      - name: Arch packages
        if: matrix.name == 'arch'
        run: |
          pacman -Syu --noconfirm --needed \
            git rust cmake clang pkgconf \
            vulkan-icd-loader libxkbcommon libxkbcommon-x11 wayland libx11 libxcb \
            fontconfig freetype2 alsa-lib dotnet-sdk curl

      - uses: actions/checkout@v4

      # The container runs as root on a checkout owned by the runner user; tests run git there.
      - name: Trust the checkout
        if: matrix.name == 'arch'
        run: git config --global --add safe.directory '*'

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.name != 'arch'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked --no-fail-fast
